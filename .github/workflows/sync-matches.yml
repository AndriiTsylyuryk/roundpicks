name: Sync WC 2026 matches

on:
  schedule:
    # Every 10 minutes during the tournament (Jun 11 – Jul 19 2026)
    - cron: '*/10 * * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: POST /api/matches/sync
        run: |
          APP_URL="${{ secrets.APP_URL }}"
          CRON_SECRET="${{ secrets.CRON_SECRET }}"
          
          # Validate required secrets
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "ERROR: APP_URL or CRON_SECRET secrets are not configured"
            exit 1
          fi
          
          echo "Calling API endpoint: $APP_URL/api/matches/sync"
          
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" -L \
            -X POST "$APP_URL/api/matches/sync" \
            -H "x-cron-secret: $CRON_SECRET")
          
          echo "Response status: $STATUS"
          
          # 200 = synced, 429 = cooldown (still ok), anything else = failure
          if [ "$STATUS" != "200" ] && [ "$STATUS" != "429" ]; then
            echo "ERROR: Unexpected status $STATUS"
            echo "Expected 200 (success) or 429 (rate limited)"
            exit 1
          fi
          
          echo "Sync completed successfully (Status: $STATUS)"